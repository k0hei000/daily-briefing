# ===============================================================
# キャッチアップするトピックの設定
# ---------------------------------------------------------------
# - トピックを足す: 下の topics にブロックを1つ追加する
# - トピックを外す: ブロックを削除するか enabled: false にする
# - 毎日の自動実行 (Routine) はこのファイルを読んで収集します
# ===============================================================

settings:
  language: ja                 # 出力言語
  lookback_hours: 36           # 何時間前までのニュースを対象にするか
  podcast_minutes: 8           # ポッドキャストの目安の長さ（分）
  archive_days: 30             # ダッシュボードに残す日数

topics:
  - id: ai
    name: 最新のAI活用事例
    icon: "🤖"
    color: "#6366f1"
    enabled: true
    max_items: 8
    subcategories:
      - サービスへのAI組み込み事例
      - 新モデル・新機能の発表
    focus: |
      - 実際のプロダクト/サービスにAIが組み込まれた事例（国内外、業種問わず）
      - 主要AIラボ（Anthropic, OpenAI, Google, Meta, xAI, Mistral, 国内勢など）の新モデル・新機能発表
      - 「自分のビジネスに転用できるか」という観点の示唆を why_it_matters に書く
    avoid: |
      - 根拠の薄い噂、単なる資金調達のみのニュース（大型を除く）

  - id: poker
    name: 日本のポーカー業界
    icon: "♠️"
    color: "#10b981"
    enabled: true
    max_items: 6
    subcategories:
      - 大会・イベント
      - 法規制・行政
      - 業界・店舗・アプリ
      - プレイヤー・コミュニティ
    focus: |
      - GLORY ACADEMY（ポーカーの学び場）を運営する立場で知っておくべき国内ポーカー情報
      - 国内の大型大会・トーナメント（JOPT, WPT/WSOP関連の日本開催・日本人の活躍など）
      - アミューズメントポーカーの法規制・警察/行政の動き・賭博関連の報道
      - ポーカー店舗・アプリ・スポンサー・教育サービスの動向
      - why_it_matters には「アカデミー運営として何を意識すべきか」を書く
    avoid: |
      - 海外オンラインカジノの宣伝的な記事

  - id: world
    name: 国内外の大型ニュース
    icon: "🌏"
    color: "#f59e0b"
    enabled: true
    max_items: 8
    subcategories:
      - 国内
      - 国際
      - 経済・マーケット
    focus: |
      - 社会人として最低限知っておくべき国内外の重要ニュース
      - 政治・経済・国際情勢・大きな災害/事故・制度変更など
      - 「明日の会話で話題に出ても困らない」レベルを目安に厳選する
    avoid: |
      - ゴシップ、芸能、スキャンダル、スポーツの小ネタ

